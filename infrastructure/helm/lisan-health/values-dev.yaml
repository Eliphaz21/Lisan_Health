# Local dev override values
global:
  environment: development

backend:
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

frontend:
  replicaCount: 1
  autoscaling:
    enabled: false
  service:
    type: NodePort
    nodePort: 30080

ingress:
  enabled: false
