apiVersion: v1
kind: Service
metadata:
  name: {{ include "lisan-health.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lisan-health.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
      name: http
  selector:
    {{- include "lisan-health.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ui
