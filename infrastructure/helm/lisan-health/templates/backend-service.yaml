apiVersion: v1
kind: Service
metadata:
  name: {{ include "lisan-health.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lisan-health.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      name: http
  selector:
    {{- include "lisan-health.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
