apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lisan-health.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lisan-health.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "backend.secrets.secretKey is required" .Values.backend.secrets.secretKey | quote }}
  DATABASE_URL: {{ required "backend.secrets.databaseUrl is required" .Values.backend.secrets.databaseUrl | quote }}
  ADMIN_EMAIL: {{ required "backend.secrets.adminEmail is required" .Values.backend.secrets.adminEmail | quote }}
  ADDIS_AI_API_KEY: {{ .Values.backend.secrets.addisAiApiKey | default "" | quote }}
  GEMINI_API_KEY: {{ .Values.backend.secrets.geminiApiKey | default "" | quote }}
