apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lisan-health-dev
  namespace: argocd
  labels:
    environment: dev
spec:
  project: lisan-health-project
  source:
    repoURL: "https://github.com/Eliphaz21/Lisan_Health.git"
    targetRevision: main
    path: infrastructure/k8s/overlays/dev
  destination:
    server: "https://kubernetes.default.svc"
    namespace: lisan-health
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
