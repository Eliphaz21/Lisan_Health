apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: prod-

resources:
  - ../../base
  - hpa.yaml
  - ingress.yaml

patches:
  - target:
      kind: Deployment
      name: lisan-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: lisan-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
