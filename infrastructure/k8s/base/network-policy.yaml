apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lisan-backend-isolation
  namespace: lisan-health
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lisan-backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lisan-frontend
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
