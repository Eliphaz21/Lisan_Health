global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "lisan-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "lisan-backend"
          environment: "production"

  - job_name: "lisan-backend-health"
    metrics_path: "/api/v1/health"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "lisan-backend"
          check: "liveness"
