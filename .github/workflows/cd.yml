name: LisanHealth CD & Infrastructure Delivery

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  k8s-kustomize-validate:
    name: Validate Kubernetes Kustomize Overlays
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate Base Manifests
        run: kustomize build infrastructure/k8s/base > /dev/null

      - name: Validate Dev Overlay
        run: kustomize build infrastructure/k8s/overlays/dev > /dev/null

      - name: Validate Prod Overlay
        run: kustomize build infrastructure/k8s/overlays/prod > /dev/null

  helm-chart-lint:
    name: Lint & Dry-Run Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Lint Default Values
        run: helm lint infrastructure/helm/lisan-health

      - name: Lint Dev Values
        run: helm lint infrastructure/helm/lisan-health -f infrastructure/helm/lisan-health/values-dev.yaml

      - name: Lint Prod Values
        run: helm lint infrastructure/helm/lisan-health -f infrastructure/helm/lisan-health/values-prod.yaml

      - name: Helm Template Dry-Run
        run: helm template lisan-release infrastructure/helm/lisan-health -f infrastructure/helm/lisan-health/values-prod.yaml > /dev/null

  security-scan:
    name: Container Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image for Scanning
        run: docker build -t lisan-backend:scan -f backend/Dockerfile .

      - name: Run Trivy Vulnerability Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'lisan-backend:scan'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  terraform-validate:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infrastructure/terraform/environments/prod fmt -check -recursive
      - run: terraform -chdir=infrastructure/terraform/environments/prod init -backend=false
      - run: terraform -chdir=infrastructure/terraform/environments/prod validate

  dast:
    name: OWASP ZAP baseline DAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable frontend stack
        run: docker compose up -d --build
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: true
      - if: always()
        run: docker compose down -v

  publish-containers:
    name: Publish Production Containers to GHCR
    runs-on: ubuntu-latest
    needs: [k8s-kustomize-validate, helm-chart-lint, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false # Set true in production when token configured
          tags: |
            ghcr.io/${{ github.repository_owner }}/lisan-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lisan-backend:${{ github.sha }}

      - name: Build & Push Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false # Set true in production when token configured
          tags: |
            ghcr.io/${{ github.repository_owner }}/lisan-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lisan-frontend:${{ github.sha }}
