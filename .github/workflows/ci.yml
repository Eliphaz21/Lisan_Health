name: LisanHealth CI / Quality Assurance

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-qa:
    name: TypeScript Backend Build & Safety Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci
      - name: Dependency vulnerability policy
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Run Backend Test Suite & Medical Invariants
        working-directory: backend
        run: npm run build

      - name: Run backend verification suite
        working-directory: backend
        run: npm test
      - name: Run isolated API integration suite
        working-directory: backend
        run: npm run test:api

  frontend-qa:
    name: Frontend Vitest & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend dependency vulnerability policy
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Vitest Unit & Component Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Verify Production Bundle Build
        working-directory: frontend
        run: npm run build

  docker-verification:
    name: Dockerfile & Compose Syntax Check
    runs-on: ubuntu-latest
    needs: [backend-qa, frontend-qa]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Container
        run: docker build -t lisan-backend:ci -f backend/Dockerfile .

      - name: Build Frontend Container
        run: docker build -t lisan-frontend:ci -f frontend/Dockerfile ./frontend

  secret-scan:
    name: Secret and source safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
