name: LisanHealth CI / Quality Assurance

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-qa:
    name: TypeScript Backend Build & Safety Invariants
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lisan_ci
          POSTGRES_PASSWORD: lisan_ci_password
          POSTGRES_DB: lisan_health_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lisan_ci -d lisan_health_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      ENVIRONMENT: test
      DATABASE_URL: postgresql://lisan_ci:lisan_ci_password@127.0.0.1:5432/lisan_health_ci
      SECRET_KEY: ci-only-secret-that-is-at-least-32-characters-long
      ADMIN_EMAIL: admin@example.com
      ADDIS_AI_TTS_ENABLED: "false"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci
      - name: Dependency vulnerability policy
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Run Backend Test Suite & Medical Invariants
        working-directory: backend
        run: npm run build

      - name: Run backend verification suite
        working-directory: backend
        run: npm test
      - name: Run isolated API integration suite
        working-directory: backend
        run: npm run test:api

  frontend-qa:
    name: Frontend Vitest & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend dependency vulnerability policy
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Vitest Unit & Component Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Verify Production Bundle Build
        working-directory: frontend
        run: npm run build

  docker-verification:
    name: Dockerfile & Compose Syntax Check
    runs-on: ubuntu-latest
    needs: [backend-qa, frontend-qa]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Container
        run: docker build -t lisan-backend:ci -f backend/Dockerfile .

      - name: Build Frontend Container
        run: docker build -t lisan-frontend:ci -f frontend/Dockerfile .

  secret-scan:
    name: Secret and source safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
