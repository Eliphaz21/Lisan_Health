apiVersion: apps/v1
kind: Deployment
metadata:
  name: lisan-frontend
  namespace: lisan-health
  labels:
    app.kubernetes.io/name: lisan-frontend
    app.kubernetes.io/component: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lisan-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lisan-frontend
        app.kubernetes.io/component: ui
    spec:
      containers:
        - name: frontend
          image: lisan-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
